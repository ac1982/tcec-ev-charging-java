name: Java 21 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build hash-verified Redis for isolated integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 120 \
            https://download.redis.io/releases/redis-7.2.16.tar.gz -o redis.tar.gz
          echo '960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e  redis.tar.gz' | sha256sum --check
          tar -xzf redis.tar.gz
          make -C redis-7.2.16 -j2 MALLOC=libc redis-server
      - name: Verify all modules and real Redis integration
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Predis-integration
          -Dredis.server.executable="${{ runner.temp }}/redis-7.2.16/src/redis-server"
          clean verify
